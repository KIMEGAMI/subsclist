name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
      - "codex/**"
      - "codex-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CI: "true"
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/subsclist_ci
  APP_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
  NEXTAUTH_SECRET: ci-auth-secret-at-least-32-characters-long
  MAIL_FROM: SubscList CI <ci@example.com>
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_USER: ci@example.com
  SMTP_PASS: ci-placeholder
  ADMIN_USER_EMAIL: admin@example.com
  DEMO_USER_EMAIL: user@example.com
  NOTIFICATION_JOB_SECRET: ci-notification-secret

jobs:
  test:
    name: Test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: subsclist_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=ci --password=ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Run lint
        run: npm run lint

      - name: Run unit and security tests
        run: npm test

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build