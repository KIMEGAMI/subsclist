name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - 'codex/**'
      - 'codex-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NODE_ENV: test
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/subsclist_ci
  APP_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
  NEXTAUTH_SECRET: ci-auth-secret-at-least-32-characters-long
  STRIPE_SECRET_KEY: sk_test_ci_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
  STRIPE_PREMIUM_PRICE_ID: price_ci_placeholder
  MAIL_FROM: SubscList CI <ci@example.com>
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_USER: ci@example.com
  SMTP_PASS: ci-placeholder
  ADMIN_USER_EMAIL: admin@example.com
  DEMO_USER_EMAIL: user@example.com
  NOTIFICATION_JOB_SECRET: ci-notification-secret

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Audit Node dependencies
        run: npm audit --audit-level=high