name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
      - "codex/**"
      - "codex-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CI: "true"
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/subsclist_ci
  TEST_DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/subsclist_ci
  APP_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  MAIL_FROM: SubscList CI <ci@example.com>
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_USER: ci@example.com
  ADMIN_USER_EMAIL: admin@example.com
  DEMO_USER_EMAIL: user@example.com

jobs:
  test:
    name: Test, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: subsclist_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=ci --password=ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          {
            printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'NEXTAUTH_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'SMTP_PASS=%s\n' "$(openssl rand -hex 32)"
            printf 'NOTIFICATION_JOB_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'NEWS_JOB_SECRET=%s\n' "$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Run lint
        run: npm run lint

      - name: Check deployment shell script syntax
        run: bash -n scripts/production-restart.sh scripts/install-pm2-autostart.sh scripts/run-notifications.sh scripts/run-daily-news.sh

      - name: Run unit and security tests
        run: npm test

      - name: Run usage tests
        run: npm run test:usage

      - name: Verify test database safety guard
        run: npm run test:db-guard

      - name: Verify savings event migration backfill
        run: npm run test:migration-backfill

      - name: Run API route security tests with coverage
        run: npm run test:routes:coverage

      - name: Verify multi-user data isolation
        run: npm run test:db-isolation

      - name: Audit Stripe identifiers
        run: npm run audit:stripe

      - name: Build application
        run: npm run build

      - name: Run end-to-end browser tests
        run: npm run test:e2e
      - name: Audit all Node dependencies
        run: npm audit --audit-level=high

